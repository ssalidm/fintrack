spring:
  application:
    name: fintrack-backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

  mail:
    host: ${FINTRACK_MAIL_HOST:localhost}
    port: ${FINTRACK_MAIL_PORT:1025}
    username: ${FINTRACK_MAIL_USERNAME:}
    password: ${FINTRACK_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${FINTRACK_MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${FINTRACK_MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

fintrack:
  security:
    jwt:
      issuer: fintrack-api
      access-token-ttl: PT15M
      refresh-token-ttl: PT24H

    email-verification:
      token-ttl: PT24H

    password-reset:
      token-ttl: PT30M

    login:
      max-failed-attempts: 5
      lock-duration: PT15M

    cors:
      allowed-origins: []

  recurring:
    processing-cron: "0 0 * * * *"
    schedule-batch-size: 100
    max-catch-up-per-schedule: 100

  email:
    enabled: ${FINTRACK_EMAIL_ENABLED:false}
    from: ${FINTRACK_EMAIL_FROM:no-reply@salif.local}
    from-name: ${FINTRACK_EMAIL_FROM_NAME:Salif}
    frontend-base-url: ${FINTRACK_FRONTEND_BASE_URL:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
