name: Bug report
description: Report unexpected or incorrect application behaviour
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Provide enough information for the issue to be reproduced.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Clearly explain what went wrong.
      placeholder: Describe the problem and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that consistently reproduce the problem.
      placeholder: |
        1. Log in
        2. Open the transactions page
        3. Select an account
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Explain what should have happened.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Explain what actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove passwords, access tokens, personal financial information, and other sensitive data before posting.
      render: shell

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Backend
        - Frontend
        - Database
        - Authentication and security
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Specify the browser, operating system, application profile, or deployment environment.
      placeholder: Windows 11, Chrome, local environment
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues before submitting this report.
          required: true
        - label: I removed sensitive information from logs and screenshots.
          required: true
